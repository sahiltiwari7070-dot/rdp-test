name: Remote Dev Box
on: workflow_dispatch

jobs:
  system:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # ---------------- INSTALL ----------------
      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y curl unzip tmate nodejs npm

      # ---------------- TMATE (SSH ACCESS) ----------------
      - name: Start tmate session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready

          echo "===== SSH ACCESS ====="
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "===== WEB ACCESS ====="
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'

      # ---------------- NGROK ----------------
      - name: Install ngrok
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz -o ngrok.tgz
          tar -xzf ngrok.tgz
          sudo mv ngrok /usr/local/bin
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}

      # ---------------- EXPOSE FIXED DOMAIN ----------------
      - name: Expose port 3000 via ngrok domain
        run: |
          ngrok http --domain=${{ secrets.NGROK_DOMAIN }} 3000
